ALLOW_VARIABLE_FREQUENCY = false
USE_CACHED_POWER_OUTPUTS = true
# Voltage levels (can have up to 10)
V0 = 0.50
V1 = 0.55
V2 = 0.60
V3 = 0.65
V4 = 0.70
V5 = 0.75
V6 = 0.80
V7 = 0.85
V8 = 0.90
# Frequency levels (can have up to 10)
F0 = 2700
F1 = 2800
F2 = 2900
F3 = 3000
F4 = 3100
F5 = 3200
F6 = 3300
F7 = 3400
F8 = 3500
F9 = 3600

# Evaluate the approach against three different baselines
# (adjusted slightly from suggested so it coincides with other computed configurations more often)
BASELINE_V0 = 0.60
BASELINE_F0 = 2700
BASELINE_V1 = 0.70
BASELINE_F1 = 3000
BASELINE_V2 = 0.80
BASELINE_F2 = 3300

# In some occassions, we raise the voltage significantly above what is required
#  to maintain frequency, to try raise temperature such that we benefit more from TEI
# TODO: additional flag that allows us to surpass baseline voltage to influence temperature up
ATTEMPT_TEMPERATURE_OPTIM = false
# Amount to raise voltage for the purpose of inluencing temperature to be hotter
VOLTAGE_UPWARDS_ADJUSTMENT = 0.1
# If we go below this, and temperature optimisation is allowed, then we will increase voltage
# artifically with the aim of higher temperature
TEMP_LOW = 348
# If we calculate a block's final peak temperature to go above this point
# adjust voltage to be minimum
TEMP_SAFEGUARD_MAX = 355
# node size (nm)
NODE_SIZE = 14
# Where should the heatsink temperature set relative to the other components
# - we assume heatsink temperature to be unit temperature + offset (negative or positive)
HEATSINK_OFFSET = 0
# How much error in the voltage should we account for in ensuring frequency safety
# TODO: this is better expressed as the temperature error - should assume x degrees colder than estimate
# and see what this makes our minimum voltage for each desired frequency
VOLTAGE_ALLOWED_ERROR = 0.02
# 50ns transition latency
TRANSITION_LATENCY_NS = 50
